name: iOS CI

on:
  pull_request:
  push:
    branches: [main, "upgrade/**"]

jobs:
  build-test:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "26.6"
      - name: Build, test and archive
        run: ./scripts/ci.sh
